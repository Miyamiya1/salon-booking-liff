<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soleil予約</title>
<style>
body{font-family:sans-serif;padding:20px;background:#F5EFE6}
label{display:block;margin-top:16px;font-weight:bold}
select,input[type=date],input[type=text]{width:100%;padding:10px;margin-top:6px;font-size:16px;box-sizing:border-box}
button{margin-top:24px;width:100%;padding:14px;background:#8C7A6B;color:#fff;border:none;border-radius:8px;font-size:16px}
.agree{margin-top:20px;font-size:14px}
.links{margin-top:14px;font-size:13px;text-align:center}
.links a{color:#8C7A6B}
</style></head>
<body>
<h2>ご予約</h2>
<p style="color:#a33;font-weight:bold">毎週月曜火曜定休日<br>夏季休暇・冬季休暇は事前にお知らせします。</p>

<label>お名前</label><input type="text" id="name" placeholder="例：山田花子">
<label>日付</label><input type="date" id="date">
<label>時間</label>
<select id="time"></select>
<label>メニュー</label>
<select id="menu">
<option>カット</option>
<option>カットトリートメント</option>
<option>カットカラー</option>
<option>カット香草カラー</option>
<option>カットヘナ</option>
<option>カラー</option>
<option>香草カラー</option>
<option>ヘナ</option>
<option>ハイライト</option>
<option>カットパーマ</option>
<option>カットデジタルパーマ</option>
<option>カットストレートパーマ</option>
<option>カット縮毛矯正</option>
<option>トリートメント</option>
<option>ヘッドスパ</option>
</select>

<div class="agree">
<label style="font-weight:normal"><input type="checkbox" id="agree" style="width:auto;display:inline"> <a href="privacy.html" target="_blank">プライバシーポリシー</a>と<a href="terms.html" target="_blank">利用規約</a>に同意する</label>
</div>

<script>
var ts=document.getElementById('time');
for(var h=10;h<=19;h++){for(var m=0;m<60;m+=30){
  var s=(h<10?'0':'')+h+':'+(m===0?'00':m);
  var o=document.createElement('option');o.text=s;ts.add(o);
}}
</script>
<button onclick="submitForm()">この内容で送信</button>

<div class="links"><a href="privacy.html">プライバシーポリシー</a>　|　<a href="terms.html">利用規約</a></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
liff.init({ liffId: "2010592990-mC1LaHF6" });
function submitForm(){
  var n=document.getElementById('name').value;
  var d=document.getElementById('date').value;
  var t=document.getElementById('time').value;
  var m=document.getElementById('menu').value;
  var agree=document.getElementById('agree').checked;
  if(!n){alert('お名前を入力してください');return;}
  if(!d){alert('日付を選択してください');return;}
  if(!agree){alert('プライバシーポリシーと利用規約への同意が必要です');return;}
  var text = "【予約希望】\nお名前："+n+"\n日付："+d+"\n時間："+t+"\nメニュー："+m;
  liff.sendMessages([{type:"text",text:text}]).then(()=>liff.closeWindow());
}
</script>
</body></html>
