<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soleil予約</title>
<style>
body{font-family:sans-serif;padding:20px;background:#F5EFE6}
label{display:block;margin-top:16px;font-weight:bold}
select,input{width:100%;padding:10px;margin-top:6px;font-size:16px}
button{margin-top:24px;width:100%;padding:14px;background:#8C7A6B;color:#fff;border:none;border-radius:8px;font-size:16px}
#timeList{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.time-btn{flex:0 0 22%;padding:10px 0;text-align:center;border:1px solid #ccc;border-radius:6px;background:#fff;font-size:14px}
.time-btn.selected{background:#8C7A6B;color:#fff;border-color:#8C7A6B}
</style></head>
<body>
<h2>ご予約</h2>
<p style="color:#a33;font-weight:bold">毎週月曜火曜定休日<br>夏季休暇・冬季休暇は事前にお知らせします。</p>
<iframe src="https://calendar.google.com/calendar/embed?src=hdusoleil08@gmail.com&ctz=Asia%2FTokyo" style="width:100%;height:300px;border:0"></iframe>
<p style="font-size:14px;color:#a33;font-weight:bold">予約はメニューによって前後する可能性があります。返信後確定とさせていただきます。</p>
<label>日付</label><input type="date" id="date" onchange="loadTimes()">
<label>時間</label>
<div id="timeList"></div>
<input type="hidden" id="time">
<label>メニュー</label>
<select id="menu">
<option>カット</option>
<option>カットトリートメント</option>
<option>カットカラー</option>
<option>カット香草カラー</option>
<option>カットヘナ</option>
<option>カラー</option>
<option>香草カラー</option>
<option>ヘナ</option>
<option>ハイライト</option>
<option>カットパーマ</option>
<option>カットデジタルパーマ</option>
<option>カットストレートパーマ</option>
<option>カット縮毛矯正</option>
<option>トリートメント</option>
<option>ヘッドスパ</option>
</select>
<button onclick="submitForm()">この内容で送信</button>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var BOOKED_API = "https://script.google.com/macros/s/AKfycbzWGHXaIcR2XGaOemsQ5IG0VXTrk4HW_43k0ezE_9bdzpXoKpVBKeExz2prXIBZEyOtUA/exec";
function allSlots(){
  var slots=[];
  for(var h=10;h<=19;h++){for(var m=0;m<60;m+=30){
    slots.push((h<10?'0':'')+h+':'+(m===0?'00':m));
  }}
  return slots;
}
function selectTime(s, isBooked, btn){
  if(isBooked){
    alert('その時間はご予約いただけません。別の時間をお選びください。');
    return;
  }
  document.getElementById('time').value = s;
  document.querySelectorAll('.time-btn').forEach(function(b){ b.classList.remove('selected'); });
  btn.classList.add('selected');
}
function renderTimes(booked){
  var list=document.getElementById('timeList');
  list.innerHTML="";
  allSlots().forEach(function(s){
    var isBooked = booked.indexOf(s)!==-1;
    var btn=document.createElement('div');
    btn.className='time-btn';
    btn.textContent=s;
    btn.onclick=function(){ selectTime(s, isBooked, btn); };
    list.appendChild(btn);
  });
}
function loadTimes(){
  var d=document.getElementById('date').value;
  document.getElementById('time').value="";
  if(!d){ document.getElementById('timeList').innerHTML=""; return; }
  fetch(BOOKED_API+"?date="+d)
    .then(function(r){return r.json();})
    .then(function(booked){ renderTimes(booked); })
    .catch(function(){ renderTimes([]); });
}
// 予約リマインドGASのURL（空なら保存せず送信だけ）
var SAVE_API = "https://script.google.com/macros/s/AKfycbzrBb37nBb9ujZmiyWqa-_Yh5fQm0muE-0epWI89LipzqiYP_nmJPf3IJoUTGlMa-Qr/exec";
var liffReady = liff.init({ liffId: "2010592990-mC1LaHF6" });
function saveBooking(d,t,m){
  if(!SAVE_API) return Promise.resolve();
  return liffReady
    .then(function(){ return liff.getProfile(); })
    .then(function(p){
      return fetch(SAVE_API,{method:"POST",mode:"no-cors",
        body:JSON.stringify({date:d,time:t,menu:m,userId:p.userId,name:p.displayName})});
    })
    .catch(function(){});
}
function submitForm(){
  var d=document.getElementById('date').value;
  var t=document.getElementById('time').value;
  var m=document.getElementById('menu').value;
  if(!d){alert('日付を選択してください');return;}
  if(!t){alert('ご希望の時間を選択してください');return;}
  var text = "【予約希望】\n日付："+d+"\n時間："+t+"\nメニュー："+m;
  saveBooking(d,t,m)
    .then(function(){ return liff.sendMessages([{type:"text",text:text}]); })
    .then(()=>liff.closeWindow());
}
</script>
</body></html>
