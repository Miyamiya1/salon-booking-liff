<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soleil予約</title>
<style>
body{font-family:sans-serif;padding:20px;background:#F5EFE6}
label{display:block;margin-top:16px;font-weight:bold}
select,input{width:100%;padding:10px;margin-top:6px;font-size:16px}
button{margin-top:24px;width:100%;padding:14px;background:#8C7A6B;color:#fff;border:none;border-radius:8px;font-size:16px}
</style></head>
<body>
<h2>ご予約</h2>
<p style="color:#a33;font-weight:bold">毎週月曜火曜定休日<br>夏季休暇・冬季休暇は事前にお知らせします。</p>
<iframe src="https://calendar.google.com/calendar/embed?src=guishigongnei687@gmail.com&ctz=Asia%2FTokyo" style="width:100%;height:300px;border:0"></iframe>
<label>日付</label><input type="date" id="date" onchange="loadTimes()">
<label>時間</label>
<select id="time"></select>
<label>メニュー</label>
<select id="menu">
<option>カット</option>
<option>カットトリートメント</option>
<option>カットカラー</option>
<option>カット香草カラー</option>
<option>カットヘナ</option>
<option>カラー</option>
<option>香草カラー</option>
<option>ヘナ</option>
<option>ハイライト</option>
<option>カットパーマ</option>
<option>カットデジタルパーマ</option>
<option>カットストレートパーマ</option>
<option>カット縮毛矯正</option>
<option>トリートメント</option>
<option>ヘッドスパ</option>
</select>
<button onclick="submitForm()">この内容で送信</button>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
var BOOKED_API = "https://script.google.com/macros/s/AKfycbzWGHXaIcR2XGaOemsQ5IG0VXTrk4HW_43k0ezE_9bdzpXoKpVBKeExz2prXIBZEyOtUA/exec";
function allSlots(){
  var slots=[];
  for(var h=10;h<=19;h++){for(var m=0;m<60;m+=30){
    slots.push((h<10?'0':'')+h+':'+(m===0?'00':m));
  }}
  return slots;
}
function loadTimes(){
  var d=document.getElementById('date').value;
  var ts=document.getElementById('time');
  ts.innerHTML="";
  if(!d) return;
  fetch(BOOKED_API+"?date="+d)
    .then(function(r){return r.json();})
    .then(function(booked){
      allSlots().forEach(function(s){
        var o=document.createElement('option');
        o.value=s;
        o.text=s;
        if(booked.indexOf(s)!==-1){ o.disabled=true; }
        ts.add(o);
      });
    })
    .catch(function(){
      allSlots().forEach(function(s){
        var o=document.createElement('option');o.value=s;o.text=s;ts.add(o);
      });
    });
}
liff.init({ liffId: "2010592990-mC1LaHF6" });
function submitForm(){
  var d=document.getElementById('date').value;
  var t=document.getElementById('time').value;
  var m=document.getElementById('menu').value;
  if(!d){alert('日付を選択してください');return;}
  if(!t){alert('ご希望の時間を選択してください');return;}
  var text = "【予約希望】\n日付："+d+"\n時間："+t+"\nメニュー："+m;
  liff.sendMessages([{type:"text",text:text}]).then(()=>liff.closeWindow());
}
</script>
</body></html>
